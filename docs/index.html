<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Русская рулетка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="balance">Баланс: <b id="balance">—</b></div>
    <button id="bonusBtn" class="small">Бонус $10</button>
  </header>

  <div id="message" class="message"></div>

  <section id="setup" class="card hidden">
    <h2>Новая игра</h2>
    <label>Режим
      <select id="mode">
        <option value="1">1: без прокрутки (патроны лежат на местах)</option>
        <option value="2">2: с прокруткой (каждый шаг как первый)</option>
      </select>
    </label>
    <label>Патронов в барабане (из 6)
      <select id="bullets">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </label>
    <label>Ставка, $
      <div class="row">
        <input id="bet" type="text" inputmode="decimal" value="1.00">
        <button id="maxBtn" class="small" type="button">Всё</button>
      </div>
    </label>
    <button id="startBtn" class="primary">Начать</button>
  </section>

  <section id="play" class="card hidden">
    <h2>Игра идёт</h2>
    <p id="gameInfo"></p>
    <p id="gameMult" class="big"></p>
    <button id="stepBtn" class="primary">Выстрел</button>
    <button id="cashBtn">Забрать выигрыш</button>
  </section>

  <section class="card">
    <h2>Рейтинг</h2>
    <ol id="board"></ol>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
